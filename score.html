<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Scorer · Pemberani 2.0</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100svh; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: rgba(0,0,0,.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
    .bar img { width: 28px; }
    .bar h1 { font-size: 17px; font-weight: 600; }
    .bar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .page { flex: 1; width: min(720px, 100% - 32px); margin: 0 auto; padding: 20px 0 40px; display: flex; flex-direction: column; gap: 16px; }
    .panel { padding: 22px; }
    .panel h2 { font-size: 24px; letter-spacing: -0.03em; }
    .panel p { color: var(--muted); margin-top: 4px; }
    .field { width: 100%; height: 50px; margin-top: 12px; padding: 0 16px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line-2); font-size: 17px; }
    .full { width: 100%; margin-top: 16px; height: 52px; }
    .err { color: #ff6961; font-size: 14px; margin-top: 10px; min-height: 1em; }

    .q-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--line); }
    .q-item:first-of-type { border-top: 0; }
    .q-item .no { color: var(--dim); font-weight: 600; font-size: 14px; }
    .q-item .t { font-weight: 500; }
    .q-item .t span { color: var(--muted); font-weight: 400; }
    .q-item.done { opacity: .45; }
    .q-item .btn { height: 38px; }

    .scorer { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .sc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sc-head .lbl { font-size: 15px; color: var(--muted); }
    .sc-head .lbl b { color: var(--text); }
    .pads { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 420px; }
    @media (orientation: landscape) and (min-width: 640px) { .pads { grid-template-rows: none; grid-template-columns: 1fr 1fr; min-height: 300px; } }
    .pad { position: relative; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; padding: 18px; text-align: center;
      transition: transform .12s var(--ease), background .2s; touch-action: manipulation; }
    .pad:active { transform: scale(.98); background: var(--card-2); }
    .pad.serving { border-color: rgba(227,179,65,.55); background: radial-gradient(80% 80% at 50% 0%, rgba(227,179,65,.12), transparent 70%), var(--card); }
    .pad .pn { font-size: clamp(20px, 5vw, 28px); font-weight: 600; letter-spacing: -0.03em; }
    .pad .ps { font-size: clamp(88px, 26vw, 160px); font-weight: 700; letter-spacing: -0.06em; line-height: 1; }
    .pad .pg { position: absolute; top: 16px; right: 18px; display: flex; gap: 5px; }
    .pad .pg i { width: 10px; height: 10px; border-radius: 50%; background: #2c2c2e; }
    .pad .pg i.on { background: var(--gold); }
    .pad .sv { position: absolute; top: 14px; left: 18px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 6px; }
    .pad .fl { position: absolute; bottom: 16px; }
    .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .tools .btn { height: 52px; }
    .notice { text-align: center; padding: 12px; border-radius: var(--radius-sm); background: var(--gold-soft); color: var(--gold-2); font-weight: 600; }
    .result { text-align: center; padding: 30px 22px; }
    .result small { color: var(--gold); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
    .result h2 { font-size: 30px; margin: 6px 0; letter-spacing: -0.035em; }
    .result .gs { font-size: 20px; color: var(--muted); }

    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
    .sheet-bg.open { display: flex; }
    .sheet { width: min(560px, 100%); background: var(--card); border-radius: 28px 28px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); animation: up .35s var(--ease); }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    .sheet h3 { font-size: 22px; letter-spacing: -0.03em; }
    .sheet p { color: var(--muted); margin: 4px 0 16px; }
    .sheet .opts { display: grid; gap: 10px; }
    .sheet .opts .btn { height: 56px; font-size: 17px; }

    details.admin { padding: 0; }
    details.admin summary { padding: 18px 22px; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
    details.admin summary::after { content: '＋'; color: var(--muted); }
    details.admin[open] summary::after { content: '－'; }
    .admin-body { padding: 0 22px 22px; display: grid; gap: 18px; }
    .admin-body h4 { font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .ko-row { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; align-items: center; font-size: 14px; }
    .ko-row select { height: 40px; font-size: 14px; margin: 0; padding: 0 30px 0 10px; background-position: right 10px center; }
    .danger { color: #ff6961; border: 1px solid rgba(255,69,58,.4); }
  </style>
</head>
<body>

<div class="bar">
  <a href="index.html" aria-label="Back to site"><img src="assets/icon.png" alt=""></a>
  <h1>Scorer</h1>
  <div class="right">
    <span class="status" id="conn"><span class="dot"></span>…</span>
    <button class="btn btn-quiet btn-sm hide" id="signOut">Sign out</button>
  </div>
</div>

<div class="page">
  <!-- Sign in -->
  <form class="card panel hide" id="login">
    <h2>Scorer sign-in</h2>
    <p>Only committee accounts can update scores.</p>
    <input class="field" type="email" id="email" placeholder="Email" autocomplete="username" required>
    <input class="field" type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn btn-primary full" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>

  <!-- Console -->
  <div class="hide" id="console" style="display:flex; flex-direction:column; gap:16px; flex:1">
    <div class="seg" role="tablist" id="courtTabs">
      <span class="thumb"></span>
      <button role="tab" data-court="1" aria-selected="true">Court 1 · Group A</button>
      <button role="tab" data-court="2" aria-selected="false">Court 2 · Group B</button>
    </div>
    <div id="main" class="scorer"></div>

    <details class="card admin">
      <summary>Committee tools</summary>
      <div class="admin-body">
        <div>
          <h4>Knockout draw overrides</h4>
          <p class="muted" style="font-size:14px;margin:4px 0 10px">Leave on “Auto” to fill from standings and results. Override only to settle a tie.</p>
          <div id="koAdmin" style="display:grid; gap:8px"></div>
        </div>
        <div>
          <h4>Correct a result</h4>
          <p class="muted" style="font-size:14px;margin:4px 0 10px">Resets a match to “not played” so it can be rescored.</p>
          <div style="display:flex; gap:8px">
            <select class="select" id="resetSel" style="margin:0; height:44px; font-size:15px"></select>
            <button class="btn btn-sm danger" id="resetBtn" style="height:44px">Reset</button>
          </div>
        </div>
      </div>
    </details>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/score.js"></script>
</body>
</html>
